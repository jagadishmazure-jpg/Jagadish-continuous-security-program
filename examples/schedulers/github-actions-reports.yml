# EXAMPLE ONLY. This file is not in .github/workflows, so it never runs in this repo.
# Copy it to .github/workflows/ in your own fork to build report previews on a schedule.
# It only builds preview files and uploads them as a workflow artifact. It sends nothing:
# there is no send step, no secret and no transport.
name: leadership-report-previews
on:
  schedule:
    - cron: "0 11 * * 1-5"   # 07:00 America/New_York during daylight time (GitHub cron is UTC)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Build previews (never sent)
        run: |
          python -m secprog report --kind daily --out out
          if [ "$(date -u +%u)" = "1" ]; then python -m secprog report --kind weekly --out out; fi
          python -m secprog dashboard --out out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-previews
          path: out/
          retention-days: 14
